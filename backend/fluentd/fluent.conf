<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match **>
  @type stdout
</match>

<match **>
  @type file
  path /fluentd/log/central.log
  append true
  compress gzip
  format json
  time_slice_format %Y%m%d%H
  time_slice_wait 10m
  buffer_type file
  buffer_path /fluentd/buffer
</match>
