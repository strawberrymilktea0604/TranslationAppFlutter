groups:
  - name: translationapp_alerts
    rules:
      - alert: BackendHighErrorRate
        expr: |
          sum(rate(translation_app_http_requests_total{http_status=~"5.."}[5m]))
          / sum(rate(translation_app_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate in TranslationApp backend"
          description: "More than 5% of HTTP requests returned 5xx errors in the last 5 minutes."

      - alert: BackendHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(translation_app_http_request_duration_seconds_bucket[5m])) by (le, method, endpoint)) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow requests in TranslationApp backend"
          description: "95th percentile request latency is above 5s for the last 5 minutes."

      - alert: PostgresExporterDown
        expr: absent(up{job="postgres_exporter"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres exporter is unavailable"
          description: "Prometheus cannot scrape the Postgres exporter."

      - alert: BackendDown
        expr: absent(up{job="backend"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "TranslationApp backend is down"
          description: "Prometheus cannot reach the backend /metrics endpoint."
