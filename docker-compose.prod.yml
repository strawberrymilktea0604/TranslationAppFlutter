version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.production
    environment:
      - ENVIRONMENT=production
      - BACKUP_DIR=/backups/database
      - HF_HUB_DISABLE_XET=1
      - HF_HOME=/models/huggingface
      - HUGGINGFACE_HUB_CACHE=/models/huggingface/hub
      - STT_DOWNLOAD_ROOT=/models/faster-whisper
      - STT_PRELOAD_TIMEOUT_SECONDS=900
    ports:
      - "8000:8000"
    volumes:
      - backups_prod:/backups
      - hf_cache_prod:/models
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/build/web:/var/www/admin:ro
    depends_on:
      - backend
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    env_file:
      - ./backend/.env.production
    ports:
      - "9187:9187"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_prod_data:/prometheus
    depends_on:
      - backend
      - postgres_exporter
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_prod_data:/alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    env_file:
      - ./backend/.env.production
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_prod_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  backups_prod:
  hf_cache_prod:
  prometheus_prod_data:
  alertmanager_prod_data:
  grafana_prod_data:
