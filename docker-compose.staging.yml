version: "3.9"

services:
  db:
    image: postgres:15
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: translation_app
    volumes:
      - db_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env.staging.local
    environment:
      - ENVIRONMENT=staging
      - HF_HUB_DISABLE_XET=1
      - HF_HOME=/models/huggingface
      - HUGGINGFACE_HUB_CACHE=/models/huggingface/hub
      - STT_DOWNLOAD_ROOT=/models/faster-whisper
      - STT_PRELOAD_TIMEOUT_SECONDS=900
    volumes:
      - hf_cache_staging:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health'); print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_staging_data:
  hf_cache_staging:
