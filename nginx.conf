events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format to capture request payload
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'request_body:"$request_body"';

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # Enable request body buffering for logging
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml application/atom+xml image/svg+xml 
               text/x-component text/x-cross-domain-policy;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # =====================================================
        # API Routes - Proxy to FastAPI Backend
        # =====================================================
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Request body logging
            proxy_pass_request_body on;
            
            # Timeouts for long-running requests
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # =====================================================
        # Admin Dashboard Routes
        # =====================================================
        location /admin {
            # Admin dashboard static files (once built)
            try_files $uri $uri/ /admin/index.html;
            root /var/www;
            
            # Cache headers for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
                root /var/www;
            }
        }

        # =====================================================
        # Health Check Endpoints
        # =====================================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /api/v1/health {
            proxy_pass http://backend;
            access_log off;
        }

        # =====================================================
        # Default Route - Root Path
        # =====================================================
        location / {
            # Redirect to API docs or admin dashboard
            return 302 /docs;
        }

        # =====================================================
        # API Documentation
        # =====================================================
        location ~ ^/(docs|openapi.json|redoc)$ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
