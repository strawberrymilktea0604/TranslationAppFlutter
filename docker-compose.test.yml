# Docker Compose for CI Testing
# This file sets up the minimal environment needed to run unit tests
version: '3.9'

services:
  test-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: translation_app_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data  # Use in-memory storage for faster tests

  test-redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    tmpfs:
      - /data  # Use in-memory storage for faster tests

  backend-tests:
    build:
      context: backend
      dockerfile: Dockerfile.test
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:test_password@test-db:5432/translation_app_test
      REDIS_URL: redis://test-redis:6379
      SECRET_KEY: test-secret-key-for-ci
      TESTING: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend/coverage:/app/coverage
      - ./backend/tests:/app/tests:ro
    networks:
      - test-network

  # E2E Test Service (runs after unit tests pass)
  e2e-tests:
    build:
      context: backend
      dockerfile: Dockerfile.test
    depends_on:
      - backend-tests
      - test-db
      - test-redis
    environment:
      DATABASE_URL: postgresql://postgres:test_password@test-db:5432/translation_app_test
      REDIS_URL: redis://test-redis:6379
      SECRET_KEY: test-secret-key-for-ci
      TESTING: "true"
      E2E_TEST: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend/coverage:/app/coverage
      - ./backend/tests:/app/tests:ro
    command: pytest tests/e2e/ -v --cov=app --cov-append --cov-report=html:/app/coverage --cov-report=term-missing
    networks:
      - test-network

networks:
  test-network:
    driver: bridge

volumes:
  test-db-data:
    driver: local
