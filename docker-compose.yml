
services:
  db:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: translation_app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: 
      - "redis-server"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"  # LRU eviction for old entries
      - "--save"
      - "60 1000"  # RDB persistence: save if 1000 keys changed in 60 seconds
      - "--appendonly"
      - "yes"  # AOF persistence for durability
      - "--appendfsync"
      - "everysec"  # Fsync every second
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data  # Persist Redis data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  log_aggregator:
    image: fluent/fluentd:v1.16-1
    ports:
      - "24224:24224"
    volumes:
      - ./backend/fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
      - ./backend/fluentd/log:/fluentd/log
      - ./backend/fluentd/buffer:/fluentd/buffer
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount Flutter web admin build output (generated by: flutter build web)
      - ./frontend/build/web:/var/www/admin:ro
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
      - ADMIN_DASHBOARD_URL=/admin
    restart: unless-stopped
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        fluentd-async: "true"
        tag: nginx
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
      - log_aggregator
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backups:/backups  # Volume for database backups
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=development
      - BACKUP_DIR=/backups/database
    restart: unless-stopped
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        fluentd-async: "true"
        tag: backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health'); print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

volumes:
  db_data:
  redis_data:
  backups:
