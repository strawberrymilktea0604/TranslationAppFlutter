name: Frontend Release Build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Build environment
        required: true
        default: prod
        type: choice
        options:
          - dev
          - staging
          - prod
      android_artifact:
        description: Android artifact to build
        required: true
        default: both
        type: choice
        options:
          - apk
          - appbundle
          - both
      build_ios:
        description: Build iOS IPA on macOS runner
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "frontend-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.7"
  FRONTEND_DIR: frontend
  BUILD_ENV: ${{ github.event.inputs.environment || 'prod' }}
  API_BASE_URL: ${{ secrets.API_BASE_URL }}

jobs:
  android-release:
    name: Android release (${{ github.event.inputs.environment || 'prod' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve target entrypoint
        id: target
        shell: bash
        run: |
          case "${BUILD_ENV}" in
            dev) echo "entrypoint=lib/main_dev.dart" >> "$GITHUB_OUTPUT" ;;
            staging) echo "entrypoint=lib/main_staging.dart" >> "$GITHUB_OUTPUT" ;;
            prod) echo "entrypoint=lib/main_prod.dart" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported environment: ${BUILD_ENV}" >&2; exit 1 ;;
          esac

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: flutter pub get

      - name: Inject google-services.json
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64}" ]; then
            echo "${GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > android/app/google-services.json
          elif [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            echo "${GOOGLE_SERVICES_JSON}" | base64 --decode > android/app/google-services.json
          else
            echo "Missing GOOGLE_SERVICES_JSON_BASE64 secret." >&2
            exit 1
          fi

      - name: Configure Android release signing
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set. Build will use debug signing fallback and is not store-ready."
            exit 0
          fi

          mkdir -p android/app
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS:-upload}
          storeFile=app/upload-keystore.jks
          EOF

      - name: Analyze
        working-directory: ${{ env.FRONTEND_DIR }}
        run: flutter analyze

      - name: Run widget smoke test
        working-directory: ${{ env.FRONTEND_DIR }}
        run: flutter test test/widget_test.dart

      - name: Build release APKs
        if: ${{ github.event.inputs.android_artifact == 'apk' || github.event.inputs.android_artifact == 'both' || github.event_name == 'push' }}
        working-directory: ${{ env.FRONTEND_DIR }}
        run: >
          flutter build apk
          --release
          --flavor ${{ env.BUILD_ENV }}
          --target ${{ steps.target.outputs.entrypoint }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --build-number ${{ github.run_number }}
          --obfuscate
          --split-debug-info build/symbols/android/${{ env.BUILD_ENV }}
          --split-per-abi

      - name: Build release App Bundle
        if: ${{ github.event.inputs.android_artifact == 'appbundle' || github.event.inputs.android_artifact == 'both' || github.event_name == 'push' }}
        working-directory: ${{ env.FRONTEND_DIR }}
        run: >
          flutter build appbundle
          --release
          --flavor ${{ env.BUILD_ENV }}
          --target ${{ steps.target.outputs.entrypoint }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --build-number ${{ github.run_number }}
          --obfuscate
          --split-debug-info build/symbols/android/${{ env.BUILD_ENV }}

      - name: Upload Android APK artifacts
        if: ${{ github.event.inputs.android_artifact == 'apk' || github.event.inputs.android_artifact == 'both' || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ env.BUILD_ENV }}-${{ github.run_number }}
          path: |
            frontend/build/app/outputs/flutter-apk/*-${{ env.BUILD_ENV }}-release.apk
            frontend/build/app/outputs/flutter-apk/*-${{ env.BUILD_ENV }}-release.apk.sha1
          if-no-files-found: error

      - name: Upload Android App Bundle artifact
        if: ${{ github.event.inputs.android_artifact == 'appbundle' || github.event.inputs.android_artifact == 'both' || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ env.BUILD_ENV }}-${{ github.run_number }}
          path: frontend/build/app/outputs/bundle/**/app-*-release.aab
          if-no-files-found: error

      - name: Upload Android obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-symbols-${{ env.BUILD_ENV }}-${{ github.run_number }}
          path: frontend/build/symbols/android/${{ env.BUILD_ENV }}
          if-no-files-found: error

  ios-release:
    name: iOS release (${{ github.event.inputs.environment || 'prod' }})
    runs-on: macos-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_ios == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve target entrypoint
        id: target
        shell: bash
        run: |
          case "${BUILD_ENV}" in
            dev) echo "entrypoint=lib/main_dev.dart" >> "$GITHUB_OUTPUT" ;;
            staging) echo "entrypoint=lib/main_staging.dart" >> "$GITHUB_OUTPUT" ;;
            prod) echo "entrypoint=lib/main_prod.dart" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported environment: ${BUILD_ENV}" >&2; exit 1 ;;
          esac

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: flutter pub get

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/translationapp.mobileprovision"
          echo "${IOS_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "$PROFILE_PATH"

      - name: Configure iOS signing
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        shell: bash
        run: |
          cat > ios/Runner/Signing.xcconfig <<EOF
          DEVELOPMENT_TEAM = ${IOS_TEAM_ID}
          CODE_SIGN_STYLE = Automatic
          CODE_SIGN_IDENTITY = Apple Distribution
          EOF

          if [ -n "${IOS_EXPORT_OPTIONS_PLIST_BASE64}" ]; then
            echo "${IOS_EXPORT_OPTIONS_PLIST_BASE64}" | base64 --decode > ios/ExportOptions.plist
          else
            cp ios/ExportOptions.example.plist ios/ExportOptions.plist
          fi

      - name: Build IPA
        working-directory: ${{ env.FRONTEND_DIR }}
        run: >
          flutter build ipa
          --target ${{ steps.target.outputs.entrypoint }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --build-number ${{ github.run_number }}
          --obfuscate
          --split-debug-info build/symbols/ios/${{ env.BUILD_ENV }}
          --export-options-plist ios/ExportOptions.plist

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ env.BUILD_ENV }}-${{ github.run_number }}
          path: frontend/build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload iOS obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: ios-symbols-${{ env.BUILD_ENV }}-${{ github.run_number }}
          path: frontend/build/symbols/ios/${{ env.BUILD_ENV }}
          if-no-files-found: error
